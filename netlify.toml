[build]
  command = "npm --prefix frontend ci --include=dev && npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/functions"

[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173
  port = 8889
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
